[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "DJ"]
ignore = ["D100", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"